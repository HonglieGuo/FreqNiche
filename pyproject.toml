[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "freqniche"
version = "1.0.0"
description = "Frequency-aware conditional diffusion learning for spatial cellular niches"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10,<3.13"
dependencies = [
  "anndata>=0.11,<0.12",
  "igraph>=0.11",
  "leidenalg>=0.10",
  "matplotlib>=3.8",
  "numpy>=2.0,<2.3",
  "pandas>=2.2",
  "psutil>=5.9",
  "pyyaml>=6.0",
  "scanpy>=1.11,<1.12",
  "scikit-learn>=1.6,<1.8",
  "scipy>=1.14,<1.16",
  "seaborn>=0.13",
  "torch>=2.6",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["freqniche_st*"]

